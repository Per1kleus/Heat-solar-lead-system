<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="VoltaFlow — capture every solar PV and heat-pump enquiry, automate follow-ups, manage quotations and close more installations." />
    <title>VoltaFlow — Lead and sales platform for solar &amp; heat-pump installers</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d9488'/%3E%3Cpath d='M17.5 5 9 18h5.5L13 27l9.5-14H17z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('vf-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
